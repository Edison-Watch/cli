[package]
name = "sealg"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for SealGate, the agentic data firewall"
license = "MIT"

[[bin]]
name = "sealg"
path = "src/main.rs"

[features]
default = ["cli"]
# CLI diagnostic subcommands (doctor / call / probe / run-scenario).
cli = []

[dependencies]
engine = { path = "../engine" }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
dialoguer = "0.12.0"
walkdir = "2"
toml_edit = "0.22"
comfy-table = "8"
anyhow = "1"

[dev-dependencies]
tempfile = "3.27.0"
