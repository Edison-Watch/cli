[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v4.6.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "biome-check", name = "Biome Check", entry = "bunx @biomejs/biome check --write .", language = "system", pass_filenames = false, always_run = true },
  { id = "cargo-fmt", name = "Cargo Format", entry = "cargo fmt --all", language = "system", pass_filenames = false, always_run = true },
  { id = "cargo-clippy", name = "Cargo Clippy", entry = "cargo clippy --workspace --all-targets -- -D warnings", language = "system", pass_filenames = false, always_run = true },
  { id = "ai-writing-check", name = "AI writing check", entry = "bun run scripts/check_ai_writing.ts", language = "system", pass_filenames = false, always_run = true },
  { id = "import-lint", name = "Crate boundary check", entry = "bun run scripts/check_import_boundaries.ts", language = "system", pass_filenames = false, always_run = true },
]

# ── Claude ↔ Codex skill & subagent sync ──────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "sync-agent-config"
name = "sync Claude ↔ Codex skills & subagents; fail if drift was fixed"
language = "system"
entry = "bun run scripts/sync_agent_config.ts --check"
pass_filenames = false
always_run = true

# ── Source-size guardrails (mirror GitHub Actions) ────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-large-files"
name = "fail if any source file exceeds the line-count error threshold"
language = "system"
entry = "scripts/check_large_files.sh"
files = "\\.(tsx|ts|rs)$"

[[repos.hooks]]
id = "check-folder-sizes"
name = "fail if any source folder exceeds the file-count error threshold"
language = "system"
entry = "scripts/check_folder_sizes.sh"
files = "\\.(tsx|ts|rs)$"

# ── sealg wire contract: Python client (python/) ↔ Rust client (crates/) ──
[[repos]]
repo = "local"

[[repos.hooks]]
id = "wire-contract"
name = "sealg wire contract: Python <-> Rust clients agree"
language = "system"
entry = "python3 scripts/check_wire_contract.py"
pass_filenames = false
# Run when the Python contract, the Rust gateway source, or the check script
# changes. Both clients live in this repo, so the check always runs both legs.
files = "^(python/sealg/(contract|client|cli)\\.py|crates/engine/src/gateway/(config|client)\\.rs|crates/cli/src/gateway_cmd\\.rs|scripts/check_wire_contract\\.py)$"
